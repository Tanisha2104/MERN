<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML A2</title>
</head>

<body>
    <h1>FORMS</h1>
    <br>
    <form action="">
        <label for="name">Name
            <input type="text" id="name" placeholder="Name">
        </label>
        <br><br>
        <label for="email">Email-id
            <input type="email" id="email" placeholder="Email-id">
        </label>
        <br><br>
        <label for="pass">Password
            <input type="password" id="pass" placeholder="Password">
        </label>
        <br><br>
        <label for="lang">Language
            <br><br>
            <input type="radio" id="HTML" name="lang">HTML
            <br>
            <input type="radio" id="CSS" name="lang">CSS
            <br>
            <input type="radio" id="JS" name="lang">JS
        </label>
        <br><br>
        <label for="course">Course
            <br><br>
            <input type="checkbox" id="java" name="course">Java Stack
            <br>
            <input type="checkbox" d="datascience" name="course">Data Science
            <br>
            <input type="checkbox" d="mern" name="course">Mern Stack
        </label>
        <br><br><br>
        <label for="field">Field:
            <br><br>
            <select name="field" id="field">
                <option value="none">Select</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JS">JS</option>
            </select>
        </label>
        <br><br>
        <label for="des">
            <textarea name="describe" id="des" placeholder="Describe yourself"></textarea>
        </label>
        <br><br>
        <label for="date">
            Date
            <br><br>
            <input type="date" name="date" id="date">
        </label>

        <br><br>
        <label for="phone">
            Phone No.
            <input type="number" name="phone" id="phone" placeholder="Phone NO.">
        </label>

        <br><br>
        <label for="submit">
            <input type="submit">
        </label>

        <br><br>
        <a href="A2_table.html">Click Here For Table File</a>
    </form>
</body>

</html>

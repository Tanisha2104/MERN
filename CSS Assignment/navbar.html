<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="navbar.css">
</head>

<body>
    <nav>
        <div class="left">
            <div><i class="fa-brands fa-bootstrap "></i></div>
            <div class="nav-hover">Home</div>
            <div class="nav-hover">Docs</div>
            <div class="nav-hover">Examples</div>
            <div class="nav-hover">Icons</div>
            <div class="nav-hover">Blog</div>
        </div>

        <div class="right">
            <div class="search">
                <label for="search">
                    <input type="text" placeholder="Search...." id="search">
                </label>
            </div>
            <div class="nav-hover"><i class="fa-brands fa-github"></i></div>
            <div class="nav-hover"><i class="fa-brands fa-twitter"></i></div>
            <div class="nav-hover"><i class="fa-brands fa-openai"></i></div>
            <div class="button">
                <button>Download</button>
            </div>
        </div>
    </nav>

    <div class="hr"></div>

    <div class="container">
        <aside class="sidebar">
            <div><i class="fa-solid fa-angle-left upper"></i></div>
            <div class="upper">
                <div>Home</div>
                <div>Dashboard</div>
                <div>Result</div>
                <div>Profile</div>
                <div>Ranklist</div>
                <div>Notices</div>
            </div>
            <div class="lower">
                <div>SignOut</div>
            </div>

        </aside>

        <main class="content">
            <section class="cards">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </section>
        </main>
    </div>



</body>

</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Picker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div class="top-bar">
        <h1>Color Picker</h1>
        <button id="darkModeBtn">🌙</button>
      </div>

      <div class="color-box" id="colorBox"></div>

      <p id="hexValue"></p>

      <div class="button-group">
        <button id="copyBtn">Copy</button>
        <button id="randomBtn">Random</button>
      </div>

      <div class="slider-group">
        <label>Red: <span id="rValue"></span></label>
        <input type="range" id="redSlider" min="0" max="255" />
      </div>

      <div class="slider-group">
        <label>Green: <span id="gValue"></span></label>
        <input type="range" id="greenSlider" min="0" max="255" />
      </div>

      <div class="slider-group">
        <label>Blue: <span id="bValue"></span></label>
        <input type="range" id="blueSlider" min="0" max="255" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!-- HTML Completed -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Detector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>KEYBOARD DETECTOR</h1>
      <div class="instruction">Press any key on keyboard</div>
      <div class="display" id="key"></div>
      <div class="info">
        <p id="keyName"></p>
        <p id="code"></p>
        <p id="KeyCode"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

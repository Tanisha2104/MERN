<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Registration Portal</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form action="" id="employeeForm">
      <h1>Employee Registration Form</h1>
      <p>Please fill out the form to complete your registration. Thank you!</p>
      <div class="outer">
        <div class="unit">
          <h3>Personal Details</h3>
          <div class="outer-block">
            <div class="block">
              <label for="empId">Employee ID</label>
              <input type="text" id="empId" />
              <small id="empIdError"></small>
            </div>
            <div class="block">
              <label for="fname">Full Name</label>
              <input type="text" id="fname" />
              <small id="fnameError"></small>
            </div>
            <div class="block">
              <label for="email">Email</label>
              <input type="text" id="email" />
              <small id="emailError"></small>
            </div>
            <div class="block">
              <label for="mobile">Mobile Number</label>
              <input type="tel" id="mobile" />
              <small id="mobileError"></small>
            </div>
          </div>
        </div>
        <div class="unit">
          <h3>Employment Details</h3>
          <div class="outer-block">
            <div class="block">
              <label for="department">Department</label>
              <select name="department" id="department">
                <option value="">Select Department</option>
                <option value="it">Information Technology</option>
                <option value="hr">Human Resources</option>
                <option value="finance">Finance</option>
                <option value="marketing">Marketing</option>
                <option value="operations">Operations</option>
              </select>
              <small id="deptError"></small>
            </div>
            <div class="block">
              <label for="designation">Designation</label>
              <input type="text" id="designation" />
              <small id="designationError"></small>
            </div>
            <div class="block">
              <label for="doj">Date of Joining</label>
              <input type="date" id="doj" />
              <small id="dojError"></small>
            </div>
            <div class="block">
              <label for="salary">Salary</label>
              <input type="number" id="salary" />
              <small id="salaryError"></small>
            </div>
          </div>
        </div>
        <div class="unit">
          <h3>Account Security</h3>
          <div class="outer-block">
            <div class="block">
              <label for="pass">Password</label>
              <input type="password" id="pass" />
              <small id="passError"></small>
            </div>
            <div class="block">
              <label for="confirmPass">Confirm Password</label>
              <input type="password" id="confirmPass" />
              <small id="confirmPassError"></small>
            </div>
          </div>
        </div>
        <div class="unit">
          <h3>Documents</h3>
          <div class="outer-block">
            <div class="block-profile">
              <label for="profile">Profile Photo</label>
              <input type="file" id="profile" />
              <small id="profileError"></small>
            </div>
            <div class="block-resume">
              <label for="resume">Resume</label>
              <input type="file" id="resume" />
              <small id="resumeError"></small>
            </div>
          </div>
        </div>
        <div class="last">
          <div class="check">
            <input type="checkbox" name="terms" id="terms" />
            <label for="terms">I accept the terms and conditions</label>
            <small id="termsError"></small>
          </div>
          <button id="register">Register</button>
        </div>
      </div>
    </form>
    <div id="success"></div>
    <script src="script.js"></script>
  </body>
</html>
